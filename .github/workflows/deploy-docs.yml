name: Deploy Money Trees documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "project_tools/create_legacy_locale_redirects.py"
      - "project_tools/check_locale_search.py"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install "mkdocs-material==9.7.7" "mkdocs-static-i18n==1.3.1"
      - name: Build documentation
        run: |
          BUILD_ONLY_LOCALE=en mkdocs build --strict
          BUILD_ONLY_LOCALE=zh-CN mkdocs build --strict --site-dir site/zh-CN
          python project_tools/create_legacy_locale_redirects.py
          python project_tools/check_locale_search.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
