site_name: Money Trees · Alpha 810 Research
site_description: A-share classic-alpha factor computation and research evidence toolkit.
site_url: https://runchengxie.github.io/money-trees/
repo_url: https://github.com/runchengxie/money-trees
extra:
  alternate:
    - name: English
      link: https://runchengxie.github.io/money-trees/
      lang: en
    - name: 简体中文
      link: https://runchengxie.github.io/money-trees/zh-CN/
      lang: zh
docs_dir: docs
exclude_docs: |
  superpowers/
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search:
      lang: !ENV [SEARCH_LANG, en]
  - i18n:
      docs_structure: suffix
      build_only_locale: !ENV [BUILD_ONLY_LOCALE]
      fallback_to_default: false
      languages:
        - locale: en
          default: true
          name: English
        - locale: zh-CN
          name: 简体中文
          site_url: https://runchengxie.github.io/money-trees/zh-CN/
          theme:
            language: zh
          nav:
            - 首页: index.md
            - 文档语言状态: language-migration-status.md
            - 公开因子证据: public-factor-evidence.md
            - 发布审计: publication-audit.md
            - 研究方法: research-methodology.md
            - 因子目录: factor-catalog.md
            - 因子族: factor-families.md
            - 数据契约: data-contract.md
            - 架构: architecture.md
            - CLI 参考: cli-reference.md
            - 运维手册: runbook.md
            - 数据入口迁移: data-platform-migration.md
            - 数据快照: data-snapshot.md
            - 数据发布资产: data-release.md
            - 数据状态检查: data-status.md
            - 经典 Alpha Python: classic-alphas-python.md
            - 因子挖掘: factor-mining.md
            - 冒烟测试: smoke-test.md
            - 配置说明: configuration.md
            - 常见工作流: cookbook.md
            - 回测产物: outputs.md
            - 测试说明: testing.md
            - 使用 DolphinDB 生成 Alpha101/191: generate-alpha101-191-with-dolphindb.md
            - 维护待办: maintenance.md
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Documentation language status: language-migration-status.md
  - Public factor evidence: public-factor-evidence.md
  - Publication audit: publication-audit.md
  - Research methodology: research-methodology.md
  - Factor catalog: factor-catalog.md
  - Factor families: factor-families.md
  - Data contract: data-contract.md
  - Architecture: architecture.md
  - CLI reference: cli-reference.md
  - Runbook: runbook.md
  - Data input migration: data-platform-migration.md
  - Data snapshots: data-snapshot.md
  - Data release assets: data-release.md
  - Data status checks: data-status.md
  - Classic Alpha Python: classic-alphas-python.md
  - Factor mining: factor-mining.md
  - Smoke test: smoke-test.md
  - Configuration: configuration.md
  - Cookbook: cookbook.md
  - Backtest outputs: outputs.md
  - Testing: testing.md
  - DolphinDB Alpha generation: generate-alpha101-191-with-dolphindb.md
  - Maintenance backlog: maintenance.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
