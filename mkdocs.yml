site_name: Money Trees · Alpha 810 Research
site_description: A-share classic-alpha factor computation and research evidence toolkit.
site_url: https://runchengxie.github.io/money-trees/
repo_url: https://github.com/runchengxie/money-trees
docs_dir: docs
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Public factor evidence: public-factor-evidence.md
  - Publication audit: publication-audit.md
  - Research methodology: research-methodology.md
  - Factor catalog: factor-catalog.md
  - Factor families: factor-families.md
  - Data contract: data-contract.md
  - Architecture: architecture.md
  - CLI reference: cli-reference.md
  - Runbook: runbook.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
