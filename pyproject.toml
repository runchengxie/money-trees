[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-tree"
version = "0.1.0"
description = "A-share cross-sectional equity research and backtesting toolkit."
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "optuna",
  "pandas",
  "PyYAML",
  "pyarrow",
  "scikit-learn",
  "scipy",
]

[project.optional-dependencies]
xgboost = ["xgboost"]

[project.scripts]
moneytree = "moneytree.cli.backtest:main"

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
