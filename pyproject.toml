[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guan-random-forest-cross-sectional"
version = "0.1.0"
description = "Cross-sectional random forest strategy backtest scripts and reproducible outputs."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "optuna",
    "pandas",
    "PyYAML",
    "pyarrow",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
xgboost = [
    "xgboost",
]

[project.scripts]
treealpha-backtest = "treealpha.cli.backtest:main"

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "pytest",
]

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
