[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-trees"
version = "0.1.0"
description = "A-share classic-alpha cross-sectional research and backtesting toolkit."
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "PyYAML",
  "pyarrow",
  "scikit-learn",
  "scipy",
]

[project.optional-dependencies]
xgboost = ["xgboost"]
tushare = ["tushare"]
external-alphas = ["dolphindb"]
tuning = ["optuna"]
research = ["tushare", "xgboost", "dolphindb", "optuna"]

[project.scripts]
moneytree = "moneytree.cli.backtest:main"
moneytrees = "moneytree.cli.backtest:main"
moneytree-tushare = "moneytree.cli.tushare:main"
moneytrees-tushare = "moneytree.cli.tushare:main"
moneytree-dolphindb-alphas = "moneytree.cli.dolphindb_alphas:main"
moneytrees-dolphindb-alphas = "moneytree.cli.dolphindb_alphas:main"

[dependency-groups]
dev = ["pytest", "ruff", "optuna"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.uv]
package = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
