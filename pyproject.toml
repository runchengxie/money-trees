[project]
name = "guan-random-forest-cross-sectional"
version = "0.1.0"
description = "Cross-sectional random forest strategy backtest scripts and reproducible outputs."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "optuna",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "pytest",
]

[tool.uv]
package = false
